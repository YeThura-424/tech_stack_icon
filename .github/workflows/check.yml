name: Check docs and catalog
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/catalog.test.cjs tests/assets.test.cjs tests/app.test.cjs
      - run: node --check docs/app.js
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python docs/generate_manifest.py --check
